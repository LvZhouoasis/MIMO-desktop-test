<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script  type="text/javascript" src="https://codesandbox.io/public/sse-hooks/sse-hooks.e15ace8ccace5398a721ffec81f121de.js"></script>
    <script  type="text/javascript" src="https://codesandbox.io/static/js/banner.d9cb10a38.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑车 · 场景与四季</title>
  <style>
    :root {
      --bg: #1B2A33;
      --ink: #F5F0E6;
      --gold: #F5E6A8;
      --muted: #9FB4B0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    h1 {
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      justify-content: center;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .status strong { color: var(--gold); font-weight: 700; }

    .stage {
      position: relative;
      width: min(940px, 100%);
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      background: #7EC8E3;
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      font-size: 0.82rem;
      line-height: 1.65;
      color: var(--muted);
      text-align: center;
    }

    /* 姿态标签旁的节奏说明在 hint 里 */

    /* ========== 场景层：用透明度过渡，避免硬切 ========== */
    #layer-city, #layer-country, #layer-rail,
    #road-city, #road-country, #road-rail {
      display: inline;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .scene-city #layer-city,
    .scene-city #road-city,
    .scene-country #layer-country,
    .scene-country #road-country,
    .scene-rail #layer-rail,
    .scene-rail #road-rail {
      opacity: 1;
    }

    /* 雪/花/落叶淡入淡出 */
    .snow-road, .snow-rail, .blossom-layer,
    .autumn-layer, .flake-layer {
      transition: opacity 1.1s ease;
    }

    /* ========== 季节色板 + 同步周期变量 ========== */
    .stage {
      --sky-a: #B5E0F5;
      --sky-b: #7EC8E3;
      --far: #8FBF7A;
      --near: #6BA35A;
      --leaf: #4E8F42;
      --ground: #C9C4B0;
      --road: #5C5C5C;
      --road-edge: #6E6E6E;
      --sun: #FFD050;
      --snow-road: 0;
      --snow-rail: 0;
      --blossom: 0;
      --autumn-leaf: 0;
      --flake: 0;
      /* 轮/踏板/腿脚/车道线共用同一周期，保证同拍 */
      --pedal-dur: 0.55s;
      --bob-dur: 0.275s;
      --scroll-scene: 3.2s;
      --scroll-hills-near: 5.5s;
      --scroll-hills-far: 10s;
      --scroll-clouds: 22s;
    }

    .season-spring {
      --sky-a: #C8ECF8;
      --sky-b: #8ED4E8;
      --far: #8FCF7A;
      --near: #6BB85A;
      --leaf: #5CB84A;
      --blossom: 1;
    }

    .season-summer {
      --sky-a: #A8DCF5;
      --sky-b: #5BB8E0;
      --far: #6FB85A;
      --near: #4E9A3E;
      --leaf: #3D8B3A;
      --sun: #FFE066;
    }

    .season-autumn {
      --sky-a: #F5D9B0;
      --sky-b: #E8B87A;
      --far: #D4A05A;
      --near: #C47A3A;
      --leaf: #E07A2F;
      --ground: #D4C4A0;
      --road: #5A5550;
      --autumn-leaf: 1;
    }

    .season-winter {
      --sky-a: #D8E8F5;
      --sky-b: #A8C0D8;
      --far: #B8C8D0;
      --near: #A0B0B8;
      --leaf: #8A9A90;
      --ground: #E8EEF2;
      --road: #6A7078;
      --road-edge: #7A8088;
      --sun: #F0E8C0;
      --snow-road: 0.55;
      --snow-rail: 0.7;
      --flake: 1;
    }

    /* ========== 背景滚动（周期由姿态变量驱动） ========== */
    .clouds     { animation: scroll-800 var(--scroll-clouds) linear infinite; }
    .hills-far  { animation: scroll-400 var(--scroll-hills-far) linear infinite; }
    .hills-near { animation: scroll-400 var(--scroll-hills-near) linear infinite; }
    .scenery    { animation: scroll-400 var(--scroll-scene) linear infinite; }
    .dashes     { animation: scroll-200 var(--pedal-dur) linear infinite; }
    .speed-lines { animation: flicker var(--pedal-dur) linear infinite; }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin var(--pedal-dur) linear infinite;
    }
    .crank-spin {
      transform-origin: 0 0;
      animation: spin var(--pedal-dur) linear infinite;
    }
    /* 腿与曲柄同周期；远侧腿相位差半圈 */
    #leg-near {
      transform-origin: 42px 58px;
      animation: leg-near var(--pedal-dur) linear infinite;
    }
    #leg-far {
      transform-origin: 40px 55px;
      animation: leg-near var(--pedal-dur) linear infinite;
      animation-delay: calc(var(--pedal-dur) * -0.5);
    }
    .rider-bob { animation: bob var(--bob-dur) ease-in-out infinite; }

    /* 骑手落点：铁路场景骑在旁侧小路上，略低一点 */
    .rider-place {
      transform: translate(280px, 250px);
    }
    .scene-rail .rider-place {
      transform: translate(280px, 268px);
    }

    #rider-tilt {
      transform-origin: 0px 116px;
      transition: transform 0.45s ease;
    }
    #pelican-body {
      transform-origin: 48px 70px;
      transition: transform 0.9s ease;
    }
    #bike-only {
      transition: transform 0.9s ease, opacity 0.6s ease;
    }
    #wing-l, #wing-r { transition: transform 0.45s ease; }
    #front-wheel-lift { transition: transform 0.45s ease; }
    .hand-on-bar { transition: opacity 0.35s ease; }
    .juggle-group { opacity: 0; transition: opacity 0.35s ease; }
    .foot-ground { opacity: 0; transition: opacity 0.35s ease; }
    .pedal-foot { opacity: 1; transition: opacity 0.35s ease; }
    .interact-prop {
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    /* ========== 下车互动模式：环境/车/身体全部静止，只保留互动小动作 ========== */
    .mode-off .clouds,
    .mode-off .hills-far,
    .mode-off .hills-near,
    .mode-off .scenery,
    .mode-off .dashes,
    .mode-off .speed-lines,
    .mode-off .rider-bob,
    .mode-off .wheel-spin,
    .mode-off .crank-spin,
    .mode-off #leg-near,
    .mode-off #leg-far,
    .mode-off .flake-layer,
    .mode-off .autumn-layer,
    .mode-off .juggle-group {
      animation: none !important;
    }
    .mode-off .speed-lines { opacity: 0; }
    .mode-off .rider-bob { transform: none; }

    /* 车停到身后，轻微倾倒（仅位移过渡，无循环动画） */
    .mode-off #bike-only {
      transform: translate(-30px, 8px) rotate(-6deg);
      opacity: 0.88;
    }
    /* 鹈鹕站到互动点，站定不走 */
    .mode-off #rider-tilt { transform: rotate(0deg); }
    .mode-off #pelican-body {
      transform: translate(95px, 8px) rotate(0deg);
    }
    .mode-off:not(.action-live) #pelican-body,
    .mode-off:not(.action-live) #wing-l,
    .mode-off:not(.action-live) #wing-r {
      animation: none !important;
    }
    .mode-off .hand-on-bar { opacity: 0; }
    .mode-off .pedal-foot { opacity: 0; }
    .mode-off .foot-ground { opacity: 1; }
    .mode-off:not(.action-live) #wing-l,
    .mode-off:not(.action-live) #wing-r {
      transform: none;
    }

    /* 互动道具：按场景显示 */
    .mode-off.scene-city #prop-city,
    .mode-off.scene-country #prop-country,
    .mode-off.scene-rail #prop-rail {
      opacity: 1;
    }
    /* 仅「正在互动」时道具与鹈鹕有轻微动作 */
    .mode-off.action-live #prop-city .prop-glow,
    .mode-off.action-live #prop-country .prop-bloom,
    .mode-off.action-live #prop-rail .prop-signal {
      animation: prop-pulse 1s ease-in-out infinite;
    }
    .mode-off.action-live #pelican-body {
      animation: interact-lean 1.2s ease-in-out infinite;
    }
    .mode-off.action-live #wing-r {
      transform-origin: 55px 45px;
      animation: wing-point 1.2s ease-in-out infinite;
    }

    /* ========== 姿态：只改周期变量与身体姿势，保证腿脚/踏板永远同拍 ========== */
    .pose-cruise {
      --pedal-dur: 0.55s;
      --bob-dur: 0.275s;
      --scroll-scene: 3.2s;
      --scroll-hills-near: 5.5s;
      --scroll-hills-far: 10s;
      --scroll-clouds: 22s;
    }
    .pose-cruise #rider-tilt { transform: rotate(0deg); }
    .pose-cruise #pelican-body { transform: translate(18px, -18px) rotate(0deg); }

    .pose-sprint {
      --pedal-dur: 0.28s;
      --bob-dur: 0.14s;
      --scroll-scene: 1.4s;
      --scroll-hills-near: 2.2s;
      --scroll-hills-far: 4.5s;
      --scroll-clouds: 10s;
    }
    .pose-sprint #rider-tilt { transform: rotate(-7deg); }
    .pose-sprint #pelican-body { transform: translate(18px, -18px) rotate(-10deg) translate(6px, 2px); }
    .pose-sprint #wing-l { transform: rotate(-25deg) translateY(4px); }
    .pose-sprint #wing-r { transform: rotate(-18deg); }

    .pose-juggle {
      --pedal-dur: 0.45s;
      --bob-dur: 0.5s;
      --scroll-scene: 2.4s;
      --scroll-hills-near: 4.2s;
      --scroll-hills-far: 8s;
      --scroll-clouds: 16s;
    }
    .pose-juggle #rider-tilt { transform: rotate(0deg); }
    .pose-juggle #pelican-body { transform: translate(18px, -28px) rotate(4deg); }
    .pose-juggle .juggle-group { opacity: 1; }
    .pose-juggle #wing-l {
      opacity: 1;
      transform: none;
      animation: wing-flap-l var(--pedal-dur) ease-in-out infinite;
    }
    .pose-juggle #wing-r {
      transform: none;
      animation: wing-flap-r var(--pedal-dur) ease-in-out infinite;
    }
    .pose-juggle .ball-a { animation: juggle-a 0.9s ease-in-out infinite; }
    .pose-juggle .ball-b { animation: juggle-b 0.9s ease-in-out infinite; }
    .pose-juggle .ball-c { animation: juggle-c 0.9s ease-in-out infinite; }

    .pose-wheelie {
      --pedal-dur: 0.4s;
      --bob-dur: 0.35s;
      --scroll-scene: 2s;
      --scroll-hills-near: 3.4s;
      --scroll-hills-far: 6.5s;
      --scroll-clouds: 14s;
    }
    .pose-wheelie #rider-tilt { transform: rotate(-16deg); }
    .pose-wheelie #pelican-body { transform: translate(18px, -18px) rotate(-4deg) translateY(-6px); }
    .pose-wheelie #front-wheel-lift { transform: translateY(-32px); }
    .pose-wheelie #wing-l { transform: rotate(-30deg) translateY(-10px); }
    .pose-wheelie #wing-r { transform: rotate(-20deg) translateY(-6px); }

    .pose-relax {
      --pedal-dur: 0.75s;
      --bob-dur: 0.55s;
      --scroll-scene: 4s;
      --scroll-hills-near: 7s;
      --scroll-hills-far: 14s;
      --scroll-clouds: 28s;
    }
    .pose-relax #rider-tilt { transform: rotate(4deg); }
    .pose-relax #pelican-body { transform: translate(12px, -14px) rotate(6deg); }
    .pose-relax #wing-l { transform: rotate(-55deg) translate(-12px, -18px); }
    .pose-relax #wing-r { transform: rotate(50deg) translate(8px, -14px); }
    .pose-relax .hand-on-bar { opacity: 0; }

    /* 季节粒子 / 积雪 */
    .snow-road { opacity: var(--snow-road); }
    .snow-rail { opacity: var(--snow-rail); }
    .blossom-layer { opacity: var(--blossom); }
    .autumn-layer { opacity: var(--autumn-leaf); }
    .flake-layer { opacity: var(--flake); }

    .flake-layer { animation: fall-flakes 4s linear infinite; }
    .autumn-layer { animation: fall-leaves 3.2s linear infinite; }

    @keyframes scroll-800 {
      from { transform: translateX(0); }
      to   { transform: translateX(-800px); }
    }
    @keyframes scroll-400 {
      from { transform: translateX(0); }
      to   { transform: translateX(-400px); }
    }
    @keyframes scroll-200 {
      from { transform: translateX(0); }
      to   { transform: translateX(-200px); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }

    @keyframes walk-step {
      0%, 100% { transform: rotate(-12deg); }
      50%      { transform: rotate(14deg); }
    }
    @keyframes wing-walk {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(10deg); }
    }
    @keyframes prop-pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.08); }
    }
    @keyframes interact-lean {
      0%, 100% { transform: translate(95px, 8px) rotate(0deg); }
      50%      { transform: translate(108px, 4px) rotate(-4deg); }
    }
    @keyframes wing-point {
      0%, 100% { transform: rotate(0deg); }
      40%      { transform: rotate(-35deg) translateY(-6px); }
      70%      { transform: rotate(-20deg) translateY(-2px); }
    }

    /* 蹬腿：与曲柄同相位 —— 0%脚在下（腿伸直），50%脚在上（抬膝） */
    @keyframes leg-near {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(16deg); }
      50%  { transform: rotate(30deg); }
      75%  { transform: rotate(16deg); }
      100% { transform: rotate(0deg); }
    }

    /* 杂耍时翅膀持续扇动，与抛球节奏呼应 */
    @keyframes wing-flap-r {
      0%, 100% { transform: rotate(-12deg) translateY(0); }
      50%      { transform: rotate(28deg) translateY(6px); }
    }
    @keyframes wing-flap-l {
      0%, 100% { transform: rotate(-50deg) translate(-6px, -10px); }
      50%      { transform: rotate(-15deg) translate(2px, 0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 0.7; }
    }
    @keyframes juggle-a {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(36px, -55px); }
    }
    @keyframes juggle-b {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-8px, -70px); }
    }
    @keyframes juggle-c {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-48px, -50px); }
    }
    @keyframes fall-flakes {
      from { transform: translate(0, -20px); }
      to   { transform: translate(-30px, 520px); }
    }
    @keyframes fall-leaves {
      from { transform: translate(0, -10px) rotate(0deg); }
      to   { transform: translate(-40px, 520px) rotate(180deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage * { animation: none !important; }
      #rider-tilt, #pelican-body, #front-wheel-lift { transition: none !important; }
    }
  </style>
</head>
<body>
  <h1>鹈鹕骑车</h1>
  <div class="status">
    <span>场景：<strong id="sceneTag">城市马路</strong></span>
    <span>季节：<strong id="seasonTag">夏天</strong></span>
    <span>姿态：<strong id="poseTag">悠闲骑</strong></span>
    <span>状态：<strong id="actionTag">骑行中</strong></span>
  </div>

  <div class="stage scene-city season-summer pose-cruise" id="stage">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕在不同场景与季节骑自行车">
      <title>鹈鹕骑车 · 多场景四季</title>
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--sky-a)"/>
          <stop offset="100%" stop-color="var(--sky-b)"/>
        </linearGradient>
        <clipPath id="frame"><rect width="800" height="500"/></clipPath>
      </defs>

      <g clip-path="url(#frame)">
        <!-- ===== 天空 ===== -->
        <rect width="800" height="500" fill="url(#skyGrad)"/>
        <g>
          <circle cx="680" cy="80" r="48" fill="var(--sun)" opacity="0.28"/>
          <circle cx="680" cy="80" r="26" fill="var(--sun)"/>
        </g>

        <!-- 云 -->
        <g class="clouds" fill="#fff" opacity="0.88">
          <g>
            <ellipse cx="110" cy="70" rx="50" ry="18"/>
            <ellipse cx="145" cy="62" rx="36" ry="20"/>
            <ellipse cx="80" cy="66" rx="28" ry="14"/>
            <ellipse cx="320" cy="115" rx="42" ry="15"/>
            <ellipse cx="540" cy="55" rx="56" ry="20"/>
            <ellipse cx="578" cy="48" rx="40" ry="22"/>
            <ellipse cx="720" cy="135" rx="38" ry="14"/>
          </g>
          <g transform="translate(800,0)">
            <ellipse cx="110" cy="70" rx="50" ry="18"/>
            <ellipse cx="145" cy="62" rx="36" ry="20"/>
            <ellipse cx="320" cy="115" rx="42" ry="15"/>
            <ellipse cx="540" cy="55" rx="56" ry="20"/>
            <ellipse cx="578" cy="48" rx="40" ry="22"/>
          </g>
        </g>

        <!-- ===== 通用远山（郊外/铁路用，城市用建筑） ===== -->
        <g class="hills-far layer" id="layer-hills-far" fill="var(--far)">
          <path d="M0 285 Q50 235 100 260 T200 250 T300 270 T400 255 L400 360 L0 360 Z"/>
          <path d="M400 285 Q450 235 500 260 T600 250 T700 270 T800 255 L800 360 L400 360 Z"/>
        </g>

        <!-- ========== 场景：城市 ========== -->
        <g id="layer-city" class="layer">
          <!-- 天际线：400px 单元平铺两份，scroll-400 无缝 -->
          <g class="scenery">
            <g fill="#6A7A88">
              <rect x="10" y="160" width="50" height="200"/>
              <rect x="70" y="200" width="40" height="160"/>
              <rect x="120" y="140" width="55" height="220"/>
              <rect x="185" y="190" width="35" height="170"/>
              <rect x="230" y="155" width="48" height="205"/>
              <rect x="290" y="175" width="42" height="185"/>
              <rect x="345" y="130" width="45" height="230"/>
            </g>
            <g fill="#7A8A98">
              <rect x="20" y="180" width="40" height="180" opacity="0.5"/>
              <rect x="100" y="200" width="36" height="160" opacity="0.5"/>
              <rect x="270" y="190" width="40" height="170" opacity="0.5"/>
            </g>
            <g fill="#FFE28A" opacity="0.75">
              <rect x="20" y="175" width="8" height="10"/><rect x="36" y="175" width="8" height="10"/>
              <rect x="20" y="195" width="8" height="10"/><rect x="36" y="195" width="8" height="10"/>
              <rect x="130" y="155" width="8" height="10"/><rect x="148" y="155" width="8" height="10"/>
              <rect x="130" y="175" width="8" height="10"/><rect x="148" y="175" width="8" height="10"/>
              <rect x="355" y="145" width="8" height="10"/>
            </g>
            <!-- 第二份 -->
            <g transform="translate(400,0)">
              <g fill="#6A7A88">
                <rect x="10" y="160" width="50" height="200"/>
                <rect x="70" y="200" width="40" height="160"/>
                <rect x="120" y="140" width="55" height="220"/>
                <rect x="185" y="190" width="35" height="170"/>
                <rect x="230" y="155" width="48" height="205"/>
                <rect x="290" y="175" width="42" height="185"/>
                <rect x="345" y="130" width="45" height="230"/>
              </g>
              <g fill="#7A8A98">
                <rect x="20" y="180" width="40" height="180" opacity="0.5"/>
                <rect x="100" y="200" width="36" height="160" opacity="0.5"/>
                <rect x="270" y="190" width="40" height="170" opacity="0.5"/>
              </g>
              <g fill="#FFE28A" opacity="0.75">
                <rect x="20" y="175" width="8" height="10"/><rect x="36" y="175" width="8" height="10"/>
                <rect x="20" y="195" width="8" height="10"/><rect x="36" y="195" width="8" height="10"/>
                <rect x="130" y="155" width="8" height="10"/><rect x="148" y="155" width="8" height="10"/>
                <rect x="130" y="175" width="8" height="10"/><rect x="148" y="175" width="8" height="10"/>
                <rect x="355" y="145" width="8" height="10"/>
              </g>
            </g>

  <p class="hint">
    骑行约 14–22 秒后会随机下车，按当前场景互动（过街按钮 / 花丛 / 信号灯）再上车<br />
    场景约 16–22 秒切换 · 季节约 20–28 秒随机变换 · 腿脚与踏板同步
  </p>

  <script>
    (function () {
      const stage = document.getElementById("stage");
      const sceneTag = document.getElementById("sceneTag");
      const seasonTag = document.getElementById("seasonTag");
      const poseTag = document.getElementById("poseTag");
      const wingL = document.getElementById("wing-l");

      const actionTag = document.getElementById("actionTag");

      const scenes = [
        { id: "scene-city", name: "城市马路", road: "road-city", interact: "按过街按钮" },
        { id: "scene-country", name: "郊外小路", road: "road-country", interact: "闻路边花丛" },
        { id: "scene-rail", name: "铁路旁", road: "road-rail", interact: "查看信号灯" }
      ];
      const seasons = [
        { id: "season-spring", name: "春天" },
        { id: "season-summer", name: "夏天" },
        { id: "season-autumn", name: "秋天" },
        { id: "season-winter", name: "冬天" }
      ];
      const poses = [
        { id: "pose-cruise", name: "悠闲骑" },
        { id: "pose-sprint", name: "快骑冲刺" },
        { id: "pose-juggle", name: "杂耍骑车" },
        { id: "pose-wheelie", name: "翘头特技" },
        { id: "pose-relax", name: "脱手闲骑" }
      ];

      const sceneClasses = scenes.map(s => s.id);
      const seasonClasses = seasons.map(s => s.id);
      const poseClasses = poses.map(p => p.id);

      let curScene = 0, curSeason = 0, curPose = 0;
      let tScene, tSeason, tPose, tOff, tBack;
      let mode = "ride"; // ride | off
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function pickDifferent(len, cur) {
        let n = cur;
        while (n === cur && len > 1) n = Math.floor(Math.random() * len);
        return n;
      }

      function applyScene(i) {
        curScene = i;
        const s = scenes[i];
        stage.classList.remove(...sceneClasses);
        stage.classList.add(s.id);
        sceneTag.textContent = s.name;
        if (mode === "off") actionTag.textContent = s.interact;
      }

      function applySeason(i) {
        curSeason = i;
        const s = seasons[i];
        stage.classList.remove(...seasonClasses);
        stage.classList.add(s.id);
        seasonTag.textContent = s.name;
      }

      function applyPose(i) {
        if (mode === "off") return;
        curPose = i;
        const p = poses[i];
        stage.classList.remove(...poseClasses);
        stage.classList.add(p.id);
        if (p.id === "pose-juggle") wingL.style.opacity = "1";
        else if (p.id === "pose-relax") wingL.style.opacity = "0.9";
        else wingL.style.opacity = "0";
        poseTag.textContent = p.name;
      }

      function enterOff() {
        if (reduced) return;
        mode = "off";
        clearTimeout(tPose);
        stage.classList.remove(...poseClasses);
        stage.classList.add("pose-cruise", "mode-off");
        poseTag.textContent = "步行";
        actionTag.textContent = "下车中…";
        wingL.style.opacity = "0";

        // 站定后开始互动（环境与车保持静止）
        clearTimeout(tBack);
        tBack = setTimeout(() => {
          stage.classList.add("action-live");
          actionTag.textContent = scenes[curScene].interact;
        }, 900);

        // 互动结束后上车
        const stay = 4500 + Math.random() * 2500;
        tOff = setTimeout(enterRide, 1000 + stay);
      }

      function enterRide() {
        mode = "ride";
        clearTimeout(tOff);
        clearTimeout(tBack);
        stage.classList.remove("mode-off", "action-live");
        applyPose(curPose);
        actionTag.textContent = "骑行中";
        schedulePose();
        scheduleDismount();
      }

      function scheduleDismount() {
        clearTimeout(tOff);
        if (reduced) return;
        // 骑约 14–22 秒后下车
        tOff = setTimeout(enterOff, 14000 + Math.random() * 8000);
      }

      function scheduleScene() {
        clearTimeout(tScene);
        if (reduced) return;
        // 场景约 16–22 秒，够看清再换
        tScene = setTimeout(() => {
          applyScene(pickDifferent(scenes.length, curScene));
          scheduleScene();
        }, 16000 + Math.random() * 6000);
      }

      function scheduleSeason() {
        clearTimeout(tSeason);
        if (reduced) return;
        // 季节约 20–28 秒，避免切换过频
        tSeason = setTimeout(() => {
          applySeason(pickDifferent(seasons.length, curSeason));
          scheduleSeason();
        }, 20000 + Math.random() * 8000);
      }

      function schedulePose() {
        clearTimeout(tPose);
        if (reduced) return;
        // 姿态约 5.5–8 秒
        tPose = setTimeout(() => {
          applyPose(pickDifferent(poses.length, curPose));
          schedulePose();
        }, 5500 + Math.random() * 2500);
      }

      // init
      applyScene(0);
      applySeason(1);
      applyPose(0);
      scheduleScene();
      scheduleSeason();
      schedulePose();
      scheduleDismount();
    })();
  </script>
